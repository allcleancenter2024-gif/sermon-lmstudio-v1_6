# Isolated production-candidate MinIO. Do not use the test Compose service.
services:
  minio-prod:
    image: minio/minio:latest
    container_name: sermon-minio-prod
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in an untracked env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in an untracked env file}
    ports:
      - "127.0.0.1:${MINIO_PROD_PORT:-19002}:9000"
      - "127.0.0.1:${MINIO_PROD_CONSOLE_PORT:-19003}:9001"
    volumes:
      - sermon_minio_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-prod-init:
    image: minio/mc:latest
    container_name: sermon-minio-prod-init
    restart: "no"
    depends_on:
      minio-prod:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio-prod:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${MINIO_BUCKET}
      && (mc admin user add local $${MINIO_APP_ACCESS_KEY} $${MINIO_APP_SECRET_KEY} || true)
      && (mc admin policy create local sermon-production-app /config/minio-production-app-policy.json || true)
      && mc admin policy attach local sermon-production-app --user $${MINIO_APP_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in an untracked env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in an untracked env file}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY must be set in an untracked env file}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY must be set in an untracked env file}
      MINIO_BUCKET: ${MINIO_BUCKET:-sermon-documents}
    volumes:
      - ./minio-production-app-policy.json:/config/minio-production-app-policy.json:ro

volumes:
  sermon_minio_prod_data:
    name: sermon-minio-prod-data
