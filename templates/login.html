<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sermon LM Studio 로그인</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font:16px system-ui,"Noto Sans KR",sans-serif}.card{width:min(420px,calc(100% - 36px));background:#fff;padding:32px;border-radius:16px;box-shadow:0 12px 36px #1720331c}h1{margin:0 0 8px;font-size:25px}p{color:#667085}.field{display:block;margin:16px 0 6px;font-weight:600}input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:8px;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#3559c7;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.error{color:#b42318;min-height:24px;margin-top:12px}.hint{font-size:13px;color:#667085}</style></head>
<body><main class="card"><h1 id="title">Sermon LM Studio</h1><p id="subtitle">계속하려면 로그인하세요.</p><form id="login"><label class="field" for="username">사용자명</label><input id="username" autocomplete="username" required minlength="3"><label class="field" for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required minlength="10"><button id="submit">로그인</button><div id="error" class="error" role="alert"></div></form><p id="hint" class="hint">첫 실행 시 이 화면에서 초기 계정을 만들 수 있습니다.</p></main><script>const form=document.querySelector('#login'),out=document.querySelector('#error'),button=document.querySelector('#submit');let setup=false;fetch('/api/auth/status').then(r=>r.json()).then(d=>{setup=!!d.setup_required;if(setup){document.querySelector('#title').textContent='Sermon LM Studio 초기 설정';document.querySelector('#subtitle').textContent='첫 관리자 계정을 만들어 시작하세요.';button.textContent='초기 계정 만들기';}}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();out.textContent='';const endpoint=setup?'/api/auth/register':'/api/auth/login';const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok){out.textContent=d.detail||'요청에 실패했습니다.';return}if(setup){setup=false;button.textContent='로그인';document.querySelector('#subtitle').textContent='계정이 생성되었습니다. 로그인하세요.';document.querySelector('#hint').textContent='';return}location.href='/';});</script></body></html>
